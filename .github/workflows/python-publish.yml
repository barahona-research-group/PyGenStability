name: Publish sdist and wheels macos-manylinux

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  CIBW_BUILD_VERBOSITY: 2
  # Keep in sync with requires-python and the versions tested in run-tox.yml
  CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
  CIBW_SKIP: '*-manylinux_i686 *-musllinux_i686'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist

      - name: Store wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build a source tarball
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Store sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  upload_wheels:
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    name: Upload wheels to PyPI
    if: github.event_name == 'release'
    steps:
      - name: Download artifacts produced during the build_wheels and build_sdist jobs
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_RELEASE}}
          packages_dir: dist/
