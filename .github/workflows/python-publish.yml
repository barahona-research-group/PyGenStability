name: Build wheels and publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  # build (but never upload) when the packaging or the C++ code changes, so a
  # broken wheel build is caught before a release
  pull_request:
    paths:
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - generalizedLouvain
      - extra/**
      - src/pygenstability/generalized_louvain/**
      - .github/workflows/python-publish.yml
      - .github/scripts/check_extension.py
  push:
    branches: [master]
    paths:
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - generalizedLouvain
      - extra/**
      - src/pygenstability/generalized_louvain/**
      - .github/workflows/python-publish.yml
      - .github/scripts/check_extension.py

env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  CIBW_BUILD_VERBOSITY: 1
  # Keep in sync with requires-python and the versions tested in run-tox.yml
  CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
  CIBW_SKIP: '*-manylinux_i686 *-musllinux_i686 *-win32'
  # The extension is optional in setup.py, so a failed compile would silently
  # produce a wheel without it: check that it is there and works.
  CIBW_TEST_COMMAND: 'python {project}/.github/scripts/check_extension.py'
  # musllinux: avoid building the scientific stack from source just to test
  CIBW_TEST_SKIP: '*-musllinux_*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux x86_64 / aarch64, macOS intel / arm64, windows x86_64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        with:
          output-dir: dist

      - name: Store wheels as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: dist

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build a source tarball
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Check that the sdist builds and the extension works
        run: |
          python -m pip install dist/*.tar.gz
          cd /tmp && python $GITHUB_WORKSPACE/.github/scripts/check_extension.py

      - name: Store sdist as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist

  upload_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release'
    permissions:
      # allows switching to PyPI trusted publishing (then drop `password`)
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_RELEASE }}
          packages-dir: dist/
