name: Run all tox python3

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - run: pip install ruff
    - run: ruff check src/pygenstability
    - run: ruff format --check src/pygenstability

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install pybind11 mypy
        pip install -e ".[all]"
    - run: mypy src/pygenstability

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc
        python -m pip install --upgrade pip setuptools
        pip install tox-gh-actions pybind11 pandoc
    - name: Run tox
      run: |
        tox

  test-os:
    name: Tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'true'
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -e ".[all]"
    - name: Check the compiled extension
      run: python .github/scripts/check_extension.py
    - name: Run tests
      run: pytest -q
